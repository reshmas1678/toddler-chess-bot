name: Daily Chess Lesson Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"  # runs daily

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        run: python main.py
